<!doctype html>
<html><head><meta charset="utf-8"><title>Librava</title><meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // links like librava.store/book/<id> open the book inside the store, any other unknown address opens the home page
  (function () {
    var m = location.pathname.match(/^\/book\/([0-9a-zA-Z-]{6,60})\/?$/);
    location.replace(m ? '/#/book/' + m[1] : '/' + (location.hash || ''));
  })();
</script></head><body style="background:#EDF0E9"></body></html>
