# Builds the pages search engines index (store home in 24 languages, category pages, one page per book,
# sitemap.xml, robots.txt) and the share previews (cover + title in WhatsApp/Facebook).
# Runs after every site update, when a book is published or changed (share-refresh function), and hourly as a safety net.
name: SEO pages
on:
  push:
    branches: [main]
    paths: ['index.html', 'assets/**', 'tools/**']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: book-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock sharp@0.33.5
      - run: node tools/book-pages.mjs
      - name: Publish if something changed
        run: |
          git add -A book sitemap.xml robots.txt en fr de es it pt nl pl ro cs sk hu bg hr sl el da sv no fi et lv lt uk
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git -c user.name="Librava bot" -c user.email="bot@librava.store" commit -m "Update SEO pages"
          git push origin HEAD:main
          git push origin HEAD:gh-pages --force
